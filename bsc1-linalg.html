<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-FACTOR | ℝ³ Linear Algebra & Vector Spaces</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root { --cyan: #00FFFF; --pink: #FF0055; --bg-void: #050505; --panel-bg: rgba(10, 10, 10, 0.92); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: var(--bg-void); color: #FFF; font-family: 'Space Mono', monospace; overflow: hidden; user-select: none; }
    #canvas-container { position: absolute; top: 0; right: 0; width: 100vw; height: 100vh; z-index: 1; animation: fadeIn 2s ease; }

    @keyframes slideInLeft { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* FLOATING HUB BUTTON */
    #hub-trigger {
      position: absolute; top: 25px; right: 35px; z-index: 25;
      background: linear-gradient(135deg, rgba(0,255,255,0.1), rgba(255,0,85,0.1));
      border: 1px solid var(--cyan); color: var(--cyan);
      font-family: 'Orbitron', sans-serif; font-size: 0.8rem; letter-spacing: 2px;
      padding: 12px 24px; cursor: pointer; transition: all 0.3s ease;
      clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
      box-shadow: 0 0 15px rgba(0,255,255,0.2);
    }
    #hub-trigger:hover { background: rgba(0, 255, 255, 0.2); border-color: var(--pink); color: var(--pink); box-shadow: 0 0 25px var(--pink); text-shadow: 0 0 8px var(--pink); transform: translateY(-2px); }

    /* COMMAND TERMINAL */
    #command-terminal {
      position: absolute; top: 0; left: 0; width: 100%; max-width: 440px; height: 100vh;
      background: var(--panel-bg); border-right: 2px solid rgba(0, 255, 255, 0.3); z-index: 10; padding: 25px; 
      display: flex; flex-direction: column; gap: 15px; backdrop-filter: blur(15px); box-shadow: 10px 0 30px rgba(0,0,0,0.9);
      overflow-y: auto; animation: slideInLeft 0.8s cubic-bezier(0.1, 1, 0.2, 1) forwards;
    }
    .terminal-header h1 { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; color: var(--cyan); letter-spacing: 2px; text-shadow: 0 0 10px var(--cyan); }
    .terminal-header h2 { font-size: 0.75rem; color: var(--pink); letter-spacing: 3px; margin-top: 4px; }
    
    .nav-tabs { display: flex; gap: 6px; border-bottom: 1px solid #333; padding-bottom: 12px; }
    .nav-btn { flex: 1; background: transparent; border: 1px solid #333; color: #888; padding: 6px 0; font-family: 'Orbitron', sans-serif; font-size: 0.65rem; cursor: pointer; transition: 0.3s; clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
    .nav-btn:hover { border-color: var(--cyan); color: #FFF; }
    .nav-btn.active { border-color: var(--cyan); background: rgba(0, 255, 255, 0.1); color: var(--cyan); box-shadow: inset 0 0 10px rgba(0,255,255,0.2); }

    .control-group { display: flex; flex-direction: column; gap: 8px; }
    .control-group label { color: var(--cyan); font-size: 0.85rem; letter-spacing: 1px; display: flex; justify-content: space-between; }
    select, input[type="text"], input[type="number"] { background: #0A0A0A; border: 1px solid rgba(0, 255, 255, 0.4); color: #FFF; padding: 8px; font-family: 'Space Mono', monospace; font-size: 0.85rem; outline: none; transition: 0.3s; clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
    select:focus, input[type="text"]:focus, input[type="number"]:focus { border-color: var(--pink); box-shadow: 0 0 10px rgba(255,0,85,0.2); }

    /* Matrix Grids */
    .matrix-grid-3x4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; background: rgba(0,0,0,0.5); padding: 10px; border: 1px solid #333; }
    .matrix-grid-3x4 input { padding: 8px 4px; text-align: center; font-size: 0.8rem; border-color: #444; border-radius: 0; clip-path: none; }
    .matrix-grid-3x4 input:focus { border-color: var(--cyan); background: rgba(0, 255, 255, 0.1); }
    
    .vector-input-row { display: flex; gap: 5px; }
    .vector-input-row input { flex: 1; text-align: center; }

    .action-btn { background: rgba(0, 255, 255, 0.1); border: 1px solid var(--cyan); color: var(--cyan); padding: 12px; font-family: 'Orbitron', sans-serif; font-size: 0.9rem; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
    .action-btn:hover { background: var(--cyan); color: #000; box-shadow: 0 0 20px var(--cyan); }
    
    .telemetry-box { background: rgba(0,0,0,0.5); border: 1px solid #222; padding: 12px; font-size: 0.75rem; line-height: 1.6; color: #CCC; max-height: 180px; overflow-y: auto; }
    .telemetry-box span { color: var(--pink); }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 3px; }

    @media (max-width: 768px) {
      #command-terminal { max-width: 350px; padding: 15px; }
      #hub-trigger { top: 15px; right: 15px; padding: 10px 15px; font-size: 0.7rem; }
      .nav-tabs { flex-wrap: wrap; }
      .nav-btn { font-size: 0.6rem; padding: 5px; }
    }
  </style>
</head>
<body>
  
  <button id="hub-trigger" onclick="window.location.href='index.html'">[ ◄ RETURN TO HUB ]</button>

  <div id="command-terminal">
    <div class="terminal-header">
      <h1>V-FACTOR LABS</h1>
      <h2>B.SC. YR 1: LINEAR ALGEBRA</h2>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button class="nav-btn active">L. ALG I</button>
      <button class="nav-btn" onclick="window.location.href='bsc1-calculus.html'">CALC I</button>
      <button class="nav-btn" onclick="window.location.href='bsc2-ode.html'">ODE II</button>
      <button class="nav-btn" onclick="window.location.href='bsc3-complex.html'">COMPLEX III</button>
    </div>

    <!-- Protocol Override Selector -->
    <div class="control-group">
      <label style="color: var(--pink);">Protocol Override</label>
      <select id="mode-select" onchange="switchMode()">
        <option value="homo">Mode A: Homogeneous Systems (Ax = 0)</option>
        <option value="gauss">Mode B: Gaussian Matrix (RREF)</option>
        <option value="span">Mode C: Vector Space & Linear Span</option>
      </select>
    </div>

    <!-- ========================================== -->
    <!-- MODE A: HOMOGENEOUS SYSTEMS (PLANES)       -->
    <!-- ========================================== -->
    <div id="mode-homo" style="display: flex; flex-direction: column; gap: 15px;">
      <div class="control-group">
        <label>System of Equations (ax + by + cz = 0)</label>
        <div class="vector-input-row">
          <input type="number" id="h1a" value="1" step="0.1"><input type="number" id="h1b" value="2" step="0.1"><input type="number" id="h1c" value="1" step="0.1">
        </div>
        <div class="vector-input-row">
          <input type="number" id="h2a" value="2" step="0.1"><input type="number" id="h2b" value="-1" step="0.1"><input type="number" id="h2c" value="3" step="0.1">
        </div>
        <div class="vector-input-row">
          <input type="number" id="h3a" value="3" step="0.1"><input type="number" id="h3b" value="1" step="0.1"><input type="number" id="h3c" value="4" step="0.1">
        </div>
      </div>
      <button class="action-btn" onclick="computeHomogeneous()">Render Intersections</button>
    </div>

    <!-- ========================================== -->
    <!-- MODE B: GAUSSIAN ELIMINATION (RREF)        -->
    <!-- ========================================== -->
    <div id="mode-gauss" style="display: none; flex-direction: column; gap: 15px;">
      <div class="control-group">
        <label>Augmented Matrix [A | b]</label>
        <div class="matrix-grid-3x4" id="gauss-matrix">
          <input type="number" id="g00" value="2"><input type="number" id="g01" value="1"><input type="number" id="g02" value="-1"><input type="number" id="g03" value="8">
          <input type="number" id="g10" value="-3"><input type="number" id="g11" value="-1"><input type="number" id="g12" value="2"><input type="number" id="g13" value="-11">
          <input type="number" id="g20" value="-2"><input type="number" id="g21" value="1"><input type="number" id="g22" value="2"><input type="number" id="g23" value="-3">
        </div>
      </div>
      <button class="action-btn" onclick="computeGaussian()">Execute Row Operations</button>
    </div>

    <!-- ========================================== -->
    <!-- MODE C: VECTOR SPACE & LINEAR SPAN         -->
    <!-- ========================================== -->
    <div id="mode-span" style="display: none; flex-direction: column; gap: 15px;">
      <div class="control-group">
        <label>Basis Vector U</label>
        <div class="vector-input-row">
          <input type="number" id="u-x" value="2"><input type="number" id="u-y" value="0"><input type="number" id="u-z" value="0">
        </div>
      </div>
      <div class="control-group">
        <label>Basis Vector W</label>
        <div class="vector-input-row">
          <input type="number" id="w-x" value="0"><input type="number" id="w-y" value="3"><input type="number" id="w-z" value="-1">
        </div>
      </div>
      <div class="control-group">
        <label style="color:var(--pink);">Target Vector v</label>
        <div class="vector-input-row">
          <input type="number" id="v-x" value="4"><input type="number" id="v-y" value="6"><input type="number" id="v-z" value="-2">
        </div>
      </div>
      <button class="action-btn" onclick="computeSpan()">Check Linear Combination</button>
    </div>

    <!-- ========================================== -->
    <!-- UNIVERSAL TELEMETRY READOUT                -->
    <!-- ========================================== -->
    <div class="control-group" style="margin-top: auto;">
      <label style="color: var(--cyan);">Mathematical Telemetry Output</label>
      <div class="telemetry-box" id="telemetry-output">
        System Initialized.<br>Awaiting dimensional inputs...
      </div>
    </div>

  </div>

  <div id="canvas-container"></div>

  <script>
    // --- UI LOGIC ---
    function switchMode() {
      const mode = document.getElementById('mode-select').value;
      document.getElementById('mode-homo').style.display = mode === 'homo' ? 'flex' : 'none';
      document.getElementById('mode-gauss').style.display = mode === 'gauss' ? 'flex' : 'none';
      document.getElementById('mode-span').style.display = mode === 'span' ? 'flex' : 'none';
      clearScene();
      document.getElementById('telemetry-output').innerHTML = "Mode Switched.<br>Ready for computation.";
    }

    // --- THREE.JS SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x050505, 0.02);
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(10, 8, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.05; controls.target.set(-2, 0, 0);

    // Coordinate System Axes
    const axesHelper = new THREE.AxesHelper(10);
    axesHelper.position.set(-2, 0, 0);
    scene.add(axesHelper);

    const gridHelper = new THREE.GridHelper(30, 30, 0x222222, 0x111111);
    gridHelper.position.set(-2, -5, 0);
    scene.add(gridHelper);

    let activeObjects = [];

    function clearScene() {
      activeObjects.forEach(obj => {
        scene.remove(obj);
        if(obj.geometry) obj.geometry.dispose();
        if(obj.material) obj.material.dispose();
      });
      activeObjects = [];
    }

    // --- MODE A: HOMOGENEOUS SYSTEMS ---
    function computeHomogeneous() {
      clearScene();
      const output = document.getElementById('telemetry-output');
      
      const m = [
        [parseFloat(document.getElementById('h1a').value), parseFloat(document.getElementById('h1b').value), parseFloat(document.getElementById('h1c').value)],
        [parseFloat(document.getElementById('h2a').value), parseFloat(document.getElementById('h2b').value), parseFloat(document.getElementById('h2c').value)],
        [parseFloat(document.getElementById('h3a').value), parseFloat(document.getElementById('h3b').value), parseFloat(document.getElementById('h3c').value)]
      ];

      // Create 3D Planes
      const colors = [0x00FFFF, 0xFF0055, 0x00FF00];
      for(let i=0; i<3; i++) {
        const normal = new THREE.Vector3(m[i][0], m[i][1], m[i][2]);
        if(normal.length() === 0) continue;
        normal.normalize();

        const geom = new THREE.PlaneGeometry(15, 15);
        const mat = new THREE.MeshBasicMaterial({ color: colors[i], side: THREE.DoubleSide, transparent: true, opacity: 0.4, depthWrite: false });
        const plane = new THREE.Mesh(geom, mat);
        
        // Align plane to face normal vector
        plane.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
        plane.position.set(-2, 0, 0);
        
        const edges = new THREE.EdgesGeometry(geom);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: colors[i] }));
        plane.add(line);

        scene.add(plane);
        activeObjects.push(plane);
      }

      // Check Determinant for Trivial vs Non-Trivial
      const det = math.det(m);
      if (Math.abs(det) > 0.001) {
        output.innerHTML = `Determinant: <span>${det.toFixed(2)}</span> (Non-Zero)<br>Status: <span>Trivial Solution Only</span><br>The planes intersect exactly at the origin (0,0,0).`;
      } else {
        output.innerHTML = `Determinant: <span>0.00</span><br>Status: <span>Non-Trivial Solutions Exist</span><br>The matrix is singular. The planes intersect along a line or represent the same plane.`;
      }
    }

    // --- MODE B: GAUSSIAN ELIMINATION (RREF) ---
    function computeGaussian() {
      clearScene();
      const output = document.getElementById('telemetry-output');
      
      let mat = [];
      for(let r=0; r<3; r++) {
        mat[r] = [];
        for(let c=0; c<4; c++) {
          mat[r][c] = parseFloat(document.getElementById(`g${r}${c}`).value);
        }
      }

      output.innerHTML = "<b>Executing Row Operations...</b><br>";
      
      // Custom Gaussian Elimination (RREF) Logic with Text Logging
      let lead = 0;
      let rows = 3;
      let cols = 4;
      
      for (let r = 0; r < rows; r++) {
        if (cols <= lead) break;
        let i = r;
        while (mat[i][lead] === 0) {
          i++;
          if (rows === i) { i = r; lead++; if (cols === lead) break; }
        }
        
        // Swap
        if (i !== r) {
          let tmp = mat[i]; mat[i] = mat[r]; mat[r] = tmp;
          output.innerHTML += `> Swap R${r+1} ↔ R${i+1}<br>`;
        }
        
        let val = mat[r][lead];
        if (val !== 0) {
          for (let j = 0; j < cols; j++) mat[r][j] /= val;
          if (Math.abs(val - 1) > 0.001) output.innerHTML += `> R${r+1} / ${val.toFixed(2)}<br>`;
        }
        
        for (let i = 0; i < rows; i++) {
          if (i === r) continue;
          val = mat[i][lead];
          if(val !== 0) {
            for (let j = 0; j < cols; j++) mat[i][j] -= val * mat[r][j];
            output.innerHTML += `> R${i+1} - (${val.toFixed(2)})R${r+1} → R${i+1}<br>`;
          }
        }
        lead++;
      }

      // Draw Resulting Vectors in 3D
      const origin = new THREE.Vector3(-2, 0, 0);
      const cList = [0x00FFFF, 0xFF0055, 0xFFFF00];
      
      output.innerHTML += "<br><b>Reduced Row Echelon Form:</b><br>";
      for(let r=0; r<3; r++) {
        output.innerHTML += `[ ${mat[r][0].toFixed(2)} &nbsp;&nbsp; ${mat[r][1].toFixed(2)} &nbsp;&nbsp; ${mat[r][2].toFixed(2)} &nbsp;&nbsp;|&nbsp;&nbsp; <span>${mat[r][3].toFixed(2)}</span> ]<br>`;
        
        // Visualize the resulting 3D coordinate vector if not zero
        let vec = new THREE.Vector3(mat[r][0], mat[r][1], mat[r][2]);
        if(vec.length() > 0.1) {
          const arrow = new THREE.ArrowHelper(vec.normalize(), origin, vec.length() * 2, cList[r], 0.5, 0.3);
          scene.add(arrow);
          activeObjects.push(arrow);
        }
      }
    }

    // --- MODE C: VECTOR SPACE & SPAN ---
    function computeSpan() {
      clearScene();
      const output = document.getElementById('telemetry-output');
      
      const uVec = new THREE.Vector3(parseFloat(document.getElementById('u-x').value), parseFloat(document.getElementById('u-y').value), parseFloat(document.getElementById('u-z').value));
      const wVec = new THREE.Vector3(parseFloat(document.getElementById('w-x').value), parseFloat(document.getElementById('w-y').value), parseFloat(document.getElementById('w-z').value));
      const vVec = new THREE.Vector3(parseFloat(document.getElementById('v-x').value), parseFloat(document.getElementById('v-y').value), parseFloat(document.getElementById('v-z').value));

      const origin = new THREE.Vector3(-2, 0, 0);
      
      // Draw U and W (Basis Vectors)
      if(uVec.length() > 0) {
        const arrowU = new THREE.ArrowHelper(uVec.clone().normalize(), origin, uVec.length(), 0x00FFFF, 0.6, 0.4);
        scene.add(arrowU); activeObjects.push(arrowU);
      }
      if(wVec.length() > 0) {
        const arrowW = new THREE.ArrowHelper(wVec.clone().normalize(), origin, wVec.length(), 0x00FFFF, 0.6, 0.4);
        scene.add(arrowW); activeObjects.push(arrowW);
      }

      // Draw Target V
      if(vVec.length() > 0) {
        const arrowV = new THREE.ArrowHelper(vVec.clone().normalize(), origin, vVec.length(), 0xFF0055, 0.8, 0.5);
        scene.add(arrowV); activeObjects.push(arrowV);
      }

      // Calculate Cross Product (Normal of the Span Plane)
      const normal = new THREE.Vector3().crossVectors(uVec, wVec);
      
      if (normal.length() < 0.001) {
        output.innerHTML = "Vectors U and W are collinear.<br>Span is a <span>1-Dimensional Line</span>.";
      } else {
        normal.normalize();
        // Draw the Span Plane
        const geom = new THREE.PlaneGeometry(25, 25);
        const mat = new THREE.MeshBasicMaterial({ color: 0x00FFFF, side: THREE.DoubleSide, transparent: true, opacity: 0.15, depthWrite: false });
        const plane = new THREE.Mesh(geom, mat);
        plane.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
        plane.position.copy(origin);
        scene.add(plane); activeObjects.push(plane);

        const grid = new THREE.GridHelper(25, 25, 0x00FFFF, 0x004444);
        grid.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
        grid.position.copy(origin);
        scene.add(grid); activeObjects.push(grid);

        // Check Linear Combination (Scalar Triple Product)
        const dotProd = vVec.dot(normal);
        if (Math.abs(dotProd) < 0.001) {
          output.innerHTML = "Target v is <span>INSIDE</span> the linear span.<br>Yes, Vector v is a linear combination of U and W.<br>Span U + W forms a 2-Dimensional Plane.";
        } else {
          output.innerHTML = "Target v is <span>OUTSIDE</span> the linear span.<br>Vector v is NOT a linear combination of U and W.<br>It breaks out of the generated 2D Plane.";
        }
      }
    }

    // --- ANIMATION LOOP ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
