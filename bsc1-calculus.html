<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-FACTOR | ℝ³ Calculus Lab: Tangent Planes & Partials</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --cyan: #00FFFF;
      --pink: #FF0055;
      --bg-void: #050505;
      --panel-bg: rgba(10, 10, 10, 0.88);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: var(--bg-void); color: #FFF; font-family: 'Space Mono', monospace; overflow: hidden; user-select: none; }
    
    @keyframes slideInLeft { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    #canvas-container {
      position: absolute; top: 0; right: 0; 
      width: 100vw; height: 100vh; z-index: 1;
      animation: fadeIn 2s ease;
    }

    #command-terminal {
      position: absolute; top: 0; left: 0;
      width: 420px; height: 100vh;
      background: var(--panel-bg);
      border-right: 2px solid rgba(0, 255, 255, 0.3);
      z-index: 10;
      padding: 25px;
      display: flex; flex-direction: column; gap: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 10px 0 30px rgba(0,0,0,0.9);
      animation: slideInLeft 0.8s cubic-bezier(0.1, 1, 0.2, 1) forwards;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 40px), calc(100% - 40px) 100%, 0 100%);
      overflow-y: auto;
    }

    .terminal-header h1 { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; color: var(--cyan); letter-spacing: 2px; text-shadow: 0 0 10px var(--cyan); }
    .terminal-header h2 { font-size: 0.75rem; color: var(--pink); letter-spacing: 3px; margin-top: 4px; }

    .nav-tabs { display: flex; gap: 6px; border-bottom: 1px solid #333; padding-bottom: 12px; }
    .nav-btn {
      flex: 1; background: transparent; border: 1px solid #333; color: #888;
      padding: 6px 0; font-family: 'Orbitron', sans-serif; font-size: 0.7rem; cursor: pointer; transition: 0.3s;
      clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    }
    .nav-btn:hover { border-color: var(--cyan); color: #FFF; }
    .nav-btn.active { border-color: var(--cyan); background: rgba(0, 255, 255, 0.1); color: var(--cyan); box-shadow: inset 0 0 10px rgba(0,255,255,0.2); }

    .control-group { display: flex; flex-direction: column; gap: 10px; }
    .control-group label { color: var(--cyan); font-size: 0.85rem; letter-spacing: 1px; display: flex; justify-content: space-between; }
    
    input[type="text"], input[type="number"] {
      background: #0A0A0A; border: 1px solid rgba(0, 255, 255, 0.4); color: #FFF;
      padding: 12px; font-family: 'Space Mono', monospace; font-size: 1rem;
      outline: none; transition: 0.3s;
      clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    }
    input[type="text"]:focus, input[type="number"]:focus { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0,255,255,0.2); }

    .row-inputs { display: flex; gap: 10px; }
    .row-inputs > div { flex: 1; display: flex; flex-direction: column; gap: 5px; }

    .action-btn {
      background: rgba(0, 255, 255, 0.1); border: 1px solid var(--cyan); color: var(--cyan);
      padding: 12px; font-family: 'Orbitron', sans-serif; font-size: 1rem; cursor: pointer;
      text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    }
    .action-btn:hover { background: var(--cyan); color: #000; box-shadow: 0 0 20px var(--cyan); }

    .telemetry-box {
      background: rgba(0,0,0,0.5); border: 1px solid #222; padding: 12px; font-size: 0.78rem; line-height: 1.6; color: #CCC;
    }
    .telemetry-box span { color: var(--cyan); }

    .utility-row { display: flex; gap: 10px; margin-top: auto; padding-top: 10px; }
    .util-btn {
      flex: 1; background: transparent; border: 1px solid #444; color: #AAA;
      padding: 8px; font-family: 'Space Mono', monospace; font-size: 0.8rem; cursor: pointer; transition: 0.3s;
    }
    .util-btn:hover { border-color: #FFF; color: #FFF; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 3px; }
  </style>
</head>
<body>

  <!-- LEFT HUD COMMAND TERMINAL -->
  <div id="command-terminal">
    
    <div class="terminal-header">
      <h1>V-FACTOR LABS</h1>
      <h2>B.SC. YR 1: CALCULUS & TANGENTS</h2>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button class="nav-btn active">Calculus I</button>
      <button class="nav-btn" onclick="window.location.href='3d-workspace.html'">ℝ³ Space</button>
      <button class="nav-btn" onclick="window.location.href='4d-workspace.html'">ℝ⁴ 4D</button>
      <button class="nav-btn" onclick="window.location.href='index.html'">Hub</button>
    </div>

    <!-- Function Input Group -->
    <div class="control-group">
      <label><span>Surface Function</span> <span>Z = f(x, y)</span></label>
      <input type="text" id="eq-input" value="sin(x) * cos(y)" placeholder="e.g., x^2 + y^2">
    </div>

    <!-- Tangent Point Selection Group -->
    <div class="control-group">
      <label>Tangent Point Evaluator $(x_0, y_0)$</label>
      <div class="row-inputs">
        <div>
          <span style="font-size:0.75rem; color:#888;">X₀ Val:</span>
          <input type="number" id="x0-input" value="1.0" step="0.1">
        </div>
        <div>
          <span style="font-size:0.75rem; color:#888;">Y₀ Val:</span>
          <input type="number" id="y0-input" value="1.0" step="0.1">
        </div>
      </div>
    </div>

    <button class="action-btn" onclick="computeCalculusLab()">Compute Surface & Tangent</button>

    <!-- Partial Derivative Analysis Readout -->
    <div class="control-group">
      <label style="color: var(--pink);">Partial Derivative Telemetry</label>
      <div class="telemetry-box" id="derivative-readout">
        f_x (∂f/∂x): <span id="fx-val">--</span><br>
        f_y (∂f/∂y): <span id="fy-val">--</span><br>
        Point Z₀: <span id="z0-val">--</span><br>
        Plane Eq: <span id="plane-eq" style="color:var(--pink);">--</span>
      </div>
    </div>

    <!-- Utility Return -->
    <div class="utility-row">
      <button class="util-btn" onclick="window.location.href='index.html'">◄ Return to Hub</button>
    </div>

  </div>

  <!-- RIGHT MAIN CANVAS -->
  <div id="canvas-container"></div>


  <script>
    /* =========================================================
       1. THREE.JS ENVIRONMENT SETUP
       ========================================================= */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.03);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(10, 8, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(-2, 0, 0); // Offset for sidebar layout

    const gridHelper = new THREE.GridHelper(40, 40, 0x222222, 0x111111);
    gridHelper.position.y = -5;
    scene.add(gridHelper);

    let surfaceMesh = null;
    let tangentPlaneMesh = null;
    let pointMarker = null;

    /* =========================================================
       2. CALCULUS ENGINE: PARTIAL DERIVATIVES & TANGENT PLANES
       ========================================================= */
    function computeCalculusLab() {
      const inputStr = document.getElementById('eq-input').value;
      const x0 = parseFloat(document.getElementById('x0-input').value);
      const y0 = parseFloat(document.getElementById('y0-input').value);

      // Clean up previous scene objects
      if (surfaceMesh) { scene.remove(surfaceMesh); surfaceMesh.geometry.dispose(); surfaceMesh.material.dispose(); }
      if (tangentPlaneMesh) { scene.remove(tangentPlaneMesh); tangentPlaneMesh.geometry.dispose(); tangentPlaneMesh.material.dispose(); }
      if (pointMarker) { scene.remove(pointMarker); pointMarker.geometry.dispose(); pointMarker.material.dispose(); }

      try {
        const node = math.parse(inputStr);
        const compiled = node.compile();

        // Evaluate function at (x0, y0)
        let z0 = compiled.evaluate({ x: x0, y: y0 });
        if (!isFinite(z0)) throw new Error("Invalid function result at point (x0, y0)");

        // Numerical Partial Derivatives using central finite difference (h = 0.0001)
        const h = 0.0001;
        let fx = (compiled.evaluate({ x: x0 + h, y: y0 }) - compiled.evaluate({ x: x0 - h, y: y0 })) / (2 * h);
        let fy = (compiled.evaluate({ x: x0, y: y0 + h }) - compiled.evaluate({ x: x0, y: y0 - h })) / (2 * h);

        // Update Telemetry Display
        document.getElementById('fx-val').innerText = fx.toFixed(4);
        document.getElementById('fy-val').innerText = fy.toFixed(4);
        document.getElementById('z0-val').innerText = z0.toFixed(4);
        document.getElementById('plane-eq').innerText = `z = ${z0.toFixed(2)} + ${fx.toFixed(2)}(x-${x0}) + ${fy.toFixed(2)}(y-${y0})`;

        // --- A. BUILD 3D SURFACE MESH ---
        const vertices = []; const colors = [];
        const colorObj = new THREE.Color();

        for (let x = -8; x <= 8; x += 0.15) {
          for (let y = -8; y <= 8; y += 0.15) {
            let z = compiled.evaluate({ x: x, y: y });
            if (!isFinite(z)) continue; 

            vertices.push(x - 2, z, y); 
            let hue = 0.5 + (z * 0.08); 
            colorObj.setHSL(hue, 1.0, 0.5);
            colors.push(colorObj.r, colorObj.g, colorObj.b);
          }
        }

        const surfGeom = new THREE.BufferGeometry();
        surfGeom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        surfGeom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        const surfMat = new THREE.PointsMaterial({ size: 0.12, vertexColors: true, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending });
        surfaceMesh = new THREE.Points(surfGeom, surfMat);
        scene.add(surfaceMesh);

        // --- B. BUILD TANGENT PLANE MESH ---
        // Equation of tangent plane: z_tangent = z0 + fx*(x - x0) + fy*(y - y0)
        const planeVertices = [];
        const planeColors = [];
        const planeColor = new THREE.Color(0xFF0055); // Neon Pink highlight for tangent plane

        const range = 2.5; // size of the tangent plane patch around (x0, y0)
        for (let dx = -range; dx <= range; dx += 0.2) {
          for (let dy = -range; dy <= range; dy += 0.2) {
            let px = x0 + dx;
            let py = y0 + dy;
            let pz = z0 + fx * (px - x0) + fy * (py - y0);

            planeVertices.push(px - 2, pz, py);
            planeColors.push(planeColor.r, planeColor.g, planeColor.b);
          }
        }

        const planeGeom = new THREE.BufferGeometry();
        planeGeom.setAttribute('position', new THREE.Float32BufferAttribute(planeVertices, 3));
        planeGeom.setAttribute('color', new THREE.Float32BufferAttribute(planeColors, 3));

        const planeMat = new THREE.PointsMaterial({ size: 0.15, vertexColors: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
        tangentPlaneMesh = new THREE.Points(planeGeom, planeMat);
        scene.add(tangentPlaneMesh);

        // --- C. HIGHLIGHT TANGENT POINT (x0, y0, z0) ---
        const markerGeom = new THREE.SphereGeometry(0.18, 16, 16);
        const markerMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
        pointMarker = new THREE.Mesh(markerGeom, markerMat);
        pointMarker.position.set(x0 - 2, z0, y0);
        scene.add(pointMarker);

      } catch (error) {
        console.error("Calculus Lab Error:", error);
        document.getElementById('plane-eq').innerText = "ERROR: Check Syntax";
      }
    }

    /* =========================================================
       3. ANIMATION LOOP
       ========================================================= */
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Run initial computation on load
    computeCalculusLab();
    animate();

  </script>
</body>
</html>
