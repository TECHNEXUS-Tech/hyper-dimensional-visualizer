<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-FACTOR | ℝ³ Complex Analysis Lab: Riemann Surfaces & Mappings</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --cyan: #00FFFF;
      --pink: #FF0055;
      --bg-void: #050505;
      --panel-bg: rgba(10, 10, 10, 0.88);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: var(--bg-void); color: #FFF; font-family: 'Space Mono', monospace; overflow: hidden; user-select: none; }
    
    @keyframes slideInLeft { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    #canvas-container {
      position: absolute; top: 0; right: 0; 
      width: 100vw; height: 100vh; z-index: 1;
      animation: fadeIn 2s ease;
    }

    #command-terminal {
      position: absolute; top: 0; left: 0;
      width: 420px; height: 100vh;
      background: var(--panel-bg);
      border-right: 2px solid rgba(0, 255, 255, 0.3);
      z-index: 10;
      padding: 25px;
      display: flex; flex-direction: column; gap: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 10px 0 30px rgba(0,0,0,0.9);
      animation: slideInLeft 0.8s cubic-bezier(0.1, 1, 0.2, 1) forwards;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 40px), calc(100% - 40px) 100%, 0 100%);
      overflow-y: auto;
    }

    .terminal-header h1 { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; color: var(--cyan); letter-spacing: 2px; text-shadow: 0 0 10px var(--cyan); }
    .terminal-header h2 { font-size: 0.75rem; color: var(--pink); letter-spacing: 3px; margin-top: 4px; }

    .nav-tabs { display: flex; gap: 6px; border-bottom: 1px solid #333; padding-bottom: 12px; }
    .nav-btn {
      flex: 1; background: transparent; border: 1px solid #333; color: #888;
      padding: 6px 0; font-family: 'Orbitron', sans-serif; font-size: 0.7rem; cursor: pointer; transition: 0.3s;
      clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    }
    .nav-btn:hover { border-color: var(--cyan); color: #FFF; }
    .nav-btn.active { border-color: var(--cyan); background: rgba(0, 255, 255, 0.1); color: var(--cyan); box-shadow: inset 0 0 10px rgba(0,255,255,0.2); }

    .control-group { display: flex; flex-direction: column; gap: 10px; }
    .control-group label { color: var(--cyan); font-size: 0.85rem; letter-spacing: 1px; display: flex; justify-content: space-between; }
    
    input[type="text"] {
      background: #0A0A0A; border: 1px solid rgba(0, 255, 255, 0.4); color: #FFF;
      padding: 12px; font-family: 'Space Mono', monospace; font-size: 1rem;
      outline: none; transition: 0.3s;
      clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
    }
    input[type="text"]:focus { border-color: var(--cyan); box-shadow: 0 0 15px rgba(0,255,255,0.2); }

    .action-btn {
      background: rgba(0, 255, 255, 0.1); border: 1px solid var(--cyan); color: var(--cyan);
      padding: 12px; font-family: 'Orbitron', sans-serif; font-size: 1rem; cursor: pointer;
      text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    }
    .action-btn:hover { background: var(--cyan); color: #000; box-shadow: 0 0 20px var(--cyan); }

    .telemetry-box {
      background: rgba(0,0,0,0.5); border: 1px solid #222; padding: 12px; font-size: 0.78rem; line-height: 1.6; color: #CCC;
    }
    .telemetry-box span { color: var(--cyan); }

    .utility-row { display: flex; gap: 10px; margin-top: auto; padding-top: 10px; }
    .util-btn {
      flex: 1; background: transparent; border: 1px solid #444; color: #AAA;
      padding: 8px; font-family: 'Space Mono', monospace; font-size: 0.8rem; cursor: pointer; transition: 0.3s;
    }
    .util-btn:hover { border-color: #FFF; color: #FFF; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #111; }
    ::-webkit-scrollbar-thumb { background: var(--cyan); border-radius: 3px; }
  </style>
</head>
<body>

  <!-- LEFT HUD COMMAND TERMINAL -->
  <div id="command-terminal">
    
    <div class="terminal-header">
      <h1>V-FACTOR LABS</h1>
      <h2>B.SC. YR 3: COMPLEX ANALYSIS</h2>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button class="nav-btn" onclick="window.location.href='bsc1-calculus.html'">Calc I</button>
      <button class="nav-btn" onclick="window.location.href='bsc2-ode.html'">ODE II</button>
      <button class="nav-btn active">Complex III</button>
      <button class="nav-btn" onclick="window.location.href='index.html'">Hub</button>
    </div>

    <!-- Complex Function Input -->
    <div class="control-group">
      <label><span>Complex Function f(z)</span> <span>z = x + i*y</span></label>
      <input type="text" id="eq-input" value="z^2" placeholder="e.g., z^3 - z, exp(z)">
    </div>

    <button class="action-btn" onclick="computeComplexLab()">Render Riemann Surface</button>

    <!-- Telemetry Readout -->
    <div class="control-group">
      <label style="color: var(--pink);">Mapping Telemetry</label>
      <div class="telemetry-box" id="complex-readout">
        Mapping Domain: <span id="domain-status">Active (x, y)</span><br>
        Codomain Amplitude: <span id="amp-status">Mapped to Z-Height</span><br>
        Status: <span style="color: #0F0;">Holomorphic Check OK</span>
      </div>
    </div>

    <!-- Utility Return -->
    <div class="utility-row">
      <button class="util-btn" onclick="window.location.href='index.html'">◄ Return to Hub</button>
    </div>

  </div>

  <!-- RIGHT MAIN CANVAS -->
  <div id="canvas-container"></div>


  <script>
    /* =========================================================
       1. THREE.JS 3D ENVIRONMENT SETUP
       ========================================================= */
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.03);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(10, 8, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(-2, 0, 0); // Offset for sidebar layout

    const gridHelper = new THREE.GridHelper(40, 40, 0x222222, 0x111111);
    gridHelper.position.y = -5;
    scene.add(gridHelper);

    let complexMesh = null;

    /* =========================================================
       2. COMPLEX ANALYSIS MAPPING ENGINE
       ========================================================= */
    function computeComplexLab() {
      const inputStr = document.getElementById('eq-input').value;

      if (complexMesh) { 
        scene.remove(complexMesh); 
        complexMesh.geometry.dispose(); 
        complexMesh.material.dispose(); 
      }

      try {
        // Prepare math.js with complex number evaluation support
        const node = math.parse(inputStr);
        const compiled = node.compile();

        const vertices = []; 
        const colors = [];
        const colorObj = new THREE.Color();

        // Scan complex plane grid (Re(z) from -4 to 4, Im(z) from -4 to 4)
        for (let x = -4; x <= 4; x += 0.1) {
          for (let y = -4; y <= 4; y += 0.1) {
            
            // Define complex number z = x + i*y
            let zVal = math.complex(x, y);
            
            // Evaluate complex function f(z)
            let result = compiled.evaluate({ z: zVal });

            // Extract real magnitude or imaginary component for 3D height mapping
            let u = typeof result === 'object' ? result.re : result;
            let v = typeof result === 'object' ? result.im : 0;

            if (!isFinite(u) || !isFinite(v)) continue;

            // Map x to X, u (Real part magnitude) to Z-height, y to Y depth
            vertices.push(x - 2, u * 0.5, y); 

            // Color map based on argument (phase angle) or magnitude
            let hue = (Math.atan2(v, u) + Math.PI) / (2 * Math.PI);
            colorObj.setHSL(hue, 1.0, 0.5);
            colors.push(colorObj.r, colorObj.g, colorObj.b);
          }
        }

        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        const mat = new THREE.PointsMaterial({ 
          size: 0.12, 
          vertexColors: true, 
          transparent: true, 
          opacity: 0.85, 
          blending: THREE.AdditiveBlending 
        });

        complexMesh = new THREE.Points(geom, mat);
        scene.add(complexMesh);

      } catch (error) {
        console.error("Complex Analysis Parser Error:", error);
      }
    }

    /* =========================================================
       3. ANIMATION LOOP
       ========================================================= */
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    computeComplexLab();
    animate();

  </script>
</body>
</html>
