<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-FACTOR | ℝ⁵ 5D Penteract Workspace</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --cyan: #00FFFF;
      --pink: #FF0055;
      --bg-void: #050505;
      --panel-bg: rgba(10, 10, 10, 0.85);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: var(--bg-void); color: #FFF; font-family: 'Space Mono', monospace; overflow: hidden; user-select: none; }
    
    @keyframes slideInLeft { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    #canvas-container { position: absolute; top: 0; right: 0; width: 100vw; height: 100vh; z-index: 1; animation: fadeIn 2s ease; }

    #command-terminal {
      position: absolute; top: 0; left: 0; width: 400px; height: 100vh;
      background: var(--panel-bg); border-right: 2px solid rgba(0, 255, 255, 0.3);
      z-index: 10; padding: 30px; display: flex; flex-direction: column; gap: 30px;
      backdrop-filter: blur(10px); box-shadow: 10px 0 30px rgba(0,0,0,0.8);
      animation: slideInLeft 0.8s cubic-bezier(0.1, 1, 0.2, 1) forwards;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 40px), calc(100% - 40px) 100%, 0 100%);
    }

    .terminal-header h1 { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; color: var(--cyan); letter-spacing: 2px; text-shadow: 0 0 10px var(--cyan); }
    .terminal-header h2 { font-size: 0.8rem; color: var(--pink); letter-spacing: 4px; margin-top: 5px; }

    .nav-tabs { display: flex; gap: 5px; border-bottom: 1px solid #333; padding-bottom: 15px; }
    .nav-btn {
      flex: 1; background: transparent; border: 1px solid #333; color: #888;
      padding: 6px 0; font-family: 'Orbitron', sans-serif; font-size: 0.75rem; cursor: pointer; transition: 0.3s;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    }
    .nav-btn:hover { border-color: var(--cyan); color: #FFF; }
    .nav-btn.active { border-color: var(--cyan); background: rgba(0, 255, 255, 0.1); color: var(--cyan); box-shadow: inset 0 0 10px rgba(0,255,255,0.2); }

    .control-group { display: flex; flex-direction: column; gap: 15px; }
    .control-group label { color: var(--cyan); font-size: 0.9rem; letter-spacing: 1px; display: flex; justify-content: space-between; }
    
    input[type="range"] {
      -webkit-appearance: none; width: 100%; background: #0A0A0A; height: 10px;
      border: 1px solid rgba(0, 255, 255, 0.4); outline: none; border-radius: 5px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 20px; height: 20px; background: var(--cyan);
      cursor: pointer; box-shadow: 0 0 10px var(--cyan);
    }

    .utility-row { display: flex; gap: 10px; margin-top: auto; }
    .util-btn { flex: 1; background: transparent; border: 1px solid #444; color: #AAA; padding: 10px; font-family: 'Space Mono', monospace; cursor: pointer; transition: 0.3s; }
    .util-btn:hover { border-color: #FFF; color: #FFF; }
  </style>
</head>
<body>

  <div id="command-terminal">
    <div class="terminal-header">
      <h1>V-FACTOR</h1>
      <h2>ℝ⁵ 5D PENTERACT</h2>
    </div>

    <div class="nav-tabs">
      <button class="nav-btn" onclick="window.location.href='3d-workspace.html'">3D</button>
      <button class="nav-btn" onclick="window.location.href='4d-workspace.html'">4D</button>
      <button class="nav-btn active">5D</button>
    </div>

    <div class="control-group">
      <label><span>5D Hyper-Rotation</span> <span id="angle-val">0.00 rad</span></label>
      <input type="range" id="hyper-slider" min="0" max="6.28" step="0.01" value="0">
    </div>

    <div class="control-group" style="margin-top: 20px; opacity: 0.5;">
      <label style="color: #888;">System Telemetry</label>
      <div style="font-size: 0.8rem; line-height: 1.5;">
        Vertices: 32 (5D) / 80 (Edges)<br>
        Pipeline: 5D → 4D → 3D<br>
        Status: <span style="color: #0F0;">Online</span>
      </div>
    </div>

    <div class="utility-row">
      <button class="util-btn" onclick="window.location.href='index.html'">◄ Return Hub</button>
      <button class="util-btn" onclick="autoRotateToggle()" id="auto-btn">Auto-Spin: OFF</button>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.03);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // --- 5D PENTERACT DATA GENERATION (32 Vertices) ---
    let hyperVertices = [];
    for (let i = 0; i < 32; i++) {
        hyperVertices.push({ 
          x: (i & 1) ? 1 : -1, 
          y: (i & 2) ? 1 : -1, 
          z: (i & 4) ? 1 : -1, 
          w: (i & 8) ? 1 : -1,
          v: (i & 16) ? 1 : -1
        });
    }

    let edges = [];
    for (let i = 0; i < 32; i++) {
        for (let j = i + 1; j < 32; j++) {
            let diff = 0;
            if (hyperVertices[i].x !== hyperVertices[j].x) diff++;
            if (hyperVertices[i].y !== hyperVertices[j].y) diff++;
            if (hyperVertices[i].z !== hyperVertices[j].z) diff++;
            if (hyperVertices[i].w !== hyperVertices[j].w) diff++;
            if (hyperVertices[i].v !== hyperVertices[j].v) diff++;
            if (diff === 1) edges.push([i, j]);
        }
    }

    const geometry = new THREE.BufferGeometry();
    const positions5D = new Float32Array(edges.length * 2 * 3); 
    geometry.setAttribute('position', new THREE.BufferAttribute(positions5D, 3));

    const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00FFFF, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
    const penteractLines = new THREE.LineSegments(geometry, lineMaterial);
    
    const pointMat = new THREE.PointsMaterial({ color: 0xFF0055, size: 0.15 });
    const penteractPoints = new THREE.Points(geometry, pointMat);
    
    scene.add(penteractLines);
    scene.add(penteractPoints);

    const slider = document.getElementById('hyper-slider');
    let autoRotate = false;
    let manualAngle = 0;

    slider.addEventListener('input', (e) => {
      manualAngle = parseFloat(e.target.value);
      document.getElementById('angle-val').innerText = manualAngle.toFixed(2) + " rad";
      if(autoRotate) autoRotateToggle();
    });

    function autoRotateToggle() {
      autoRotate = !autoRotate;
      const btn = document.getElementById('auto-btn');
      btn.innerText = autoRotate ? "Auto-Spin: ON" : "Auto-Spin: OFF";
      btn.style.borderColor = autoRotate ? "#00FFFF" : "#444";
      btn.style.color = autoRotate ? "#00FFFF" : "#AAA";
    }

    function update5DProjection(angle) {
      let index = 0;

      for (let i = 0; i < edges.length; i++) {
          for (let j = 0; j < 2; j++) {
              let pt = hyperVertices[edges[i][j]];

              // 5D Multi-Plane Rotations (XW and YV planes)
              let x = pt.x * Math.cos(angle) - pt.w * Math.sin(angle);
              let w = pt.x * Math.sin(angle) + pt.w * Math.cos(angle);
              
              let y = pt.y * Math.cos(angle) - pt.v * Math.sin(angle);
              let v = pt.y * Math.sin(angle) + pt.v * Math.cos(angle);
              
              let z = pt.z;

              // Double Stereographic Projection (5D -> 4D -> 3D)
              let distance1 = 3.0;
              let p1 = 1 / (distance1 - v); // 5D to 4D
              
              let x4 = x * p1;
              let y4 = y * p1;
              let z4 = z * p1;
              let w4 = w * p1;

              let distance2 = 2.5;
              let p2 = 1 / (distance2 - w4); // 4D to 3D

              positions5D[index++] = (x4 * p2) * 2.5;
              positions5D[index++] = (y4 * p2) * 2.5;
              positions5D[index++] = (z4 * p2) * 2.5;
          }
      }
      geometry.attributes.position.needsUpdate = true;
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      if (autoRotate) {
        manualAngle += 0.008;
        if(manualAngle > 6.28) manualAngle = 0;
        slider.value = manualAngle;
        document.getElementById('angle-val').innerText = manualAngle.toFixed(2) + " rad";
      }

      update5DProjection(manualAngle);
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
